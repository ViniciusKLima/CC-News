<aside class="admin-sidebar">
  <a class="admin-logo" routerLink="/admin">
    <img src="/LogoConectaNewsADM-White.svg" alt="Conecta News" class="img-logo" />
  </a>

  <!-- Navegação principal. Usuários Internos fica visível mas desabilitado
       para quem não é administrador. -->
  <nav class="admin-nav" aria-label="Navegação administrativa">
    @if (souAdministrador()) {
      <a class="admin-nav-item" routerLink="/admin/usuarios" routerLinkActive="active">
        <i class="bi bi-people"></i> <span>Usuários Internos</span>
      </a>
    } @else {
      <span class="admin-nav-item disabled" aria-disabled="true">
        <i class="bi bi-people"></i> <span>Usuários Internos</span>
      </span>
    }
    <a
      class="admin-nav-item"
      routerLink="/admin"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-journal-text"></i> <span>Publicações</span>
    </a>
  </nav>

  <!-- Área do usuário logado: avatar, nome/perfil e o menu de sair -->
  <div class="admin-user" (click)="alternarMenuUsuario($event)">
    <span class="admin-user-avatar">{{ iniciaisUsuario() }}</span>
    <div class="admin-user-info">
      <strong>{{ nomeUsuario() }}</strong>
      <span>{{ labelMeuPerfil() }}</span>
    </div>
    <i class="bi bi-chevron-down"></i>

    @if (menuUsuarioAberto()) {
      <div class="admin-user-menu" (click)="$event.stopPropagation()">
        <div class="admin-user-menu-info">
          <strong>{{ nomeUsuario() }}</strong>
          <span>{{ labelMeuPerfil() }}</span>
        </div>
        <button type="button" (click)="sair()">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
    }
  </div>
</aside>
