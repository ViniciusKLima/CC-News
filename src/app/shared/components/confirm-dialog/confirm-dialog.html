@if (confirmDialogService.confirmacao(); as confirmacao) {
  <div
    class="modal-backdrop"
    appFecharAoClicarFora
    (fecharAoClicarFora)="confirmDialogService.responder(false)"
  >
    <div class="modal-painel" role="alertdialog" aria-modal="true" [attr.aria-label]="confirmacao.titulo">
      <h2>{{ confirmacao.titulo }}</h2>
      <p>{{ confirmacao.descricao }}</p>

      <footer class="modal-rodape">
        <button type="button" class="btn-secundario" (click)="confirmDialogService.responder(false)">
          {{ confirmacao.rotuloCancelar }}
        </button>
        <button
          type="button"
          class="btn-confirmar"
          [class.btn-perigo]="confirmacao.variante === 'perigo'"
          (click)="confirmDialogService.responder(true)"
        >
          {{ confirmacao.rotuloConfirmar }}
        </button>
      </footer>
    </div>
  </div>
}
