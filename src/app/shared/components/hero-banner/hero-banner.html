<section
  class="hero d-flex align-items-center"
  [class.compacto]="compacto()"
  [style.background-image]="'url(' + imagemUrl() + ')'"
  [style.--hero-pos-mobile]="posicaoMobileCss()"
>
  <div class="container">
    <div class="txt-hero">
      <div class="tt-hero">
        <h3 class="conecta">{{ tituloKicker() }}</h3>
        <h1 class="news">{{ titulo() }}</h1>
      </div>

      <p class="p-hero">{{ texto() }}</p>
    </div>
  </div>

  <ng-content select="[heroAcoes]"></ng-content>
</section>
